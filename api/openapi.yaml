      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 120
        irreversible:
          type: boolean
        mode:
          $ref: '#/components/schemas/ExecutionMode'
        id:
          $ref: '#/components/schemas/ID'
        database_id:
          $ref: '#/components/schemas/ID'
        state:
          $ref: '#/components/schemas/DefinitionState'
        revision:
          $ref: '#/components/schemas/Revision'
        checksum:
          $ref: '#/components/schemas/Checksum'
        created_by:
          $ref: '#/components/schemas/ID'
        created_at:
          type: string
          format: date-time
          description: RFC 3339 UTC, ending in Z.
          example: '2026-11-10T10:00:00Z'
        updated_at:
          type: string
          format: date-time
          description: RFC 3339 UTC, ending in Z.
          example: '2026-11-10T10:00:00Z'
        first_execution_at:
          type: string
          format: date-time
          description: RFC 3339 UTC, ending in Z.
          example: '2026-11-10T10:00:00Z'
          nullable: true
      required:
      - title
      - irreversible
      - mode
      - id
      - database_id
      - state
      - revision
      - checksum
      - created_by
      - created_at
      - updated_at
      - first_execution_at
      description: List projection excludes SQL bodies. Fetch migration detail for review/editing.
    Position:
      type: object
      additionalProperties: false
      properties:
        version:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
        active_execution_id:
          type: string
          format: uuid
          nullable: true
          description: Null when not applicable.
        active_migration_id:
          type: string
          format: uuid
          nullable: true
          description: Null when not applicable.
        can_rollback:
          type: boolean
        rollback_execution_id:
          type: string
          format: uuid
          nullable: true
          description: Null when not applicable.
        can_forward:
          type: boolean
        forward_execution_id:
          type: string
          format: uuid
          nullable: true
          description: Null when not applicable.
        forward_migration_id:
          type: string
          format: uuid
          nullable: true
          description: Null when not applicable.
        blocked_by_job_id:
          type: string
          format: uuid
          nullable: true
          description: Null when not applicable.
      required:
      - version
      - active_execution_id
      - active_migration_id
      - can_rollback
      - rollback_execution_id
      - can_forward
      - forward_execution_id
      - forward_migration_id
      - blocked_by_job_id
      description: Capabilities describe position/reversibility only, not caller authorization. Viewer can read
        these values; UI must also check access. Blocked databases cannot apply/rollback/forward new work.
