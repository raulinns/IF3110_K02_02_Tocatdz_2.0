      description: HttpOnly cookie, browser-managed. Never put the session identifier in a response model.
  parameters:
    database_id:
      name: database_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ID'
    migration_id:
      name: migration_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ID'
    change_request_id:
      name: change_request_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ID'
    job_id:
      name: job_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ID'
    execution_id:
      name: execution_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ID'
    user_id:
      name: user_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ID'
    group_id:
      name: group_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ID'
    connection_id:
      name: connection_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ID'
    schema:
      name: schema
      in: path
      required: true
      schema:
        type: string
        minLength: 1
      description: One URL-encoded identifier; at most 63 UTF-8 bytes. No dotted SQL path.
    table:
      name: table
      in: path
      required: true
      schema:
        type: string
        minLength: 1
      description: One URL-encoded identifier; at most 63 UTF-8 bytes.
    page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        format: int64
        minimum: 1
        maximum: 9007199254740991
        default: 1
      description: Canonical positive integer; offset (page-1)*limit <= 1000000.
    limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        format: int64
        minimum: 1
        maximum: 200
        default: 50
    csrf:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string
        minLength: 1
      description: Required for authenticated unsafe methods; get from /auth/me.
  headers:
    RequestID:
      description: Server-generated request correlation ID (untrusted inbound IDs are replaced).
      schema:
        type: string
    NoStore:
      description: API responses must not be cached.
      schema:
        type: string
        enum:
        - no-store
    SessionCookie:
      description: HttpOnly; SameSite=Lax; Path=/; Secure in production. Session rotation can set this on ANY authenticated
        response, including errors. Never read it from JS or expose it in JSON.
      schema:
        type: string
    Location:
      description: Relative URI of the created resource/job.
      schema:
        type: string
    RetryAfter:
      description: Delay in seconds before retrying.
      schema:
        type: integer
        minimum: 1
  responses:
    BadRequest:
      description: Malformed JSON/query/path; code bad_request.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        Set-Cookie:
          $ref: '#/components/headers/SessionCookie'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unauthenticated:
      description: Missing/expired session or invalid login; code unauthenticated.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        Set-Cookie:
          $ref: '#/components/headers/SessionCookie'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Forbidden:
      description: Permission denied (forbidden) or invalid Origin/CSRF (csrf_failed).
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        Set-Cookie:
          $ref: '#/components/headers/SessionCookie'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: Resource absent or not in the authorized database; code not_found.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        Set-Cookie:
          $ref: '#/components/headers/SessionCookie'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    MethodNotAllowed:
      description: Unsupported method; code method_not_allowed. Allow header is required.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        Set-Cookie:
          $ref: '#/components/headers/SessionCookie'
        Allow:
          description: Supported methods.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Conflict:
      description: CAS, workflow, membership, approval or position conflict; code conflict; optional stable reason.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        Set-Cookie:
          $ref: '#/components/headers/SessionCookie'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    PayloadTooLarge:
      description: Request body exceeds route limit; code payload_too_large.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        Set-Cookie:
          $ref: '#/components/headers/SessionCookie'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    UnsupportedMediaType:
      description: JSON request body requires application/json; code unsupported_media_type.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        Set-Cookie:
          $ref: '#/components/headers/SessionCookie'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ValidationFailed:
      description: Valid JSON but invalid fields/SQL (validation_failed), or result exceeds limits (result_too_large).
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        Set-Cookie:
          $ref: '#/components/headers/SessionCookie'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    RateLimited:
      description: Login throttled; code rate_limited; Retry-After is required.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        Set-Cookie:
          $ref: '#/components/headers/SessionCookie'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Internal:
      description: Unexpected failure; code internal. No internal details.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        Set-Cookie:
          $ref: '#/components/headers/SessionCookie'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unavailable:
      description: Dependency temporarily unavailable; code unavailable.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        Set-Cookie:
          $ref: '#/components/headers/SessionCookie'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  schemas:
    ID:
      type: string
      format: uuid
      pattern: ^(?!00000000-0000-0000-0000-000000000000$)[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
      example: 30000000-0000-4000-8000-000000000001
      description: Canonical lowercase, nonzero UUID; opaque identity.
    Revision:
      type: integer
      format: int64
      minimum: 1
      maximum: 9007199254740991
      description: CAS token. Never infer this from list order or a timestamp.
    Checksum:
      type: string
      pattern: ^[0-9a-f]{64}$
      description: Version-1 definition checksum; clients display/cache it, never compute it.
    Access:
      type: string
      enum:
      - view_only
      - view_edit
    ChangeKind:
      type: string
      enum:
      - apply
      - rollback
      - forward
      - resume
      - revert_batches
    CRStatus:
      type: string
      enum:
      - pending_review
      - approved
      - rejected
      - queued
      - running
      - succeeded
      - failed
      - partial
      - uncertain
      - partially_reverted
    JobStatus:
      type: string
      enum:
      - queued
      - running
      - succeeded
      - failed
      - partial
      - uncertain
      - partially_reverted
    ExecutionMode:
      type: string
      enum:
      - normal
      - batch
    DefinitionState:
      type: string
      enum:
      - draft
      - frozen
    Direction:
      type: string
      enum:
      - up
      - down
    Decision:
      type: string
      enum:
      - approve
      - reject
    ErrorCode:
      type: string
      enum:
      - bad_request
      - unauthenticated
      - forbidden
      - not_found
      - method_not_allowed
      - validation_failed
      - conflict
      - csrf_failed
      - rate_limited
      - payload_too_large
      - unsupported_media_type
      - result_too_large
      - unavailable
      - internal
    Error:
      type: object
      additionalProperties: false
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
        request_id:
          type: string
        reason:
          type: string
          description: Optional stable domain reason, e.g. missing_leader, stale_approval, position_changed, irreversible,
            database_blocked, revision_mismatch.
        fields:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          description: Keys are request field paths (e.g. batch.key_column); messages never echo submitted secrets.
      required:
      - code
      - message
      - request_id
    ErrorEnvelope:
      type: object
      additionalProperties: false
      properties:
        error:
          $ref: '#/components/schemas/Error'
      required:
      - error
      example:
        error:
          code: conflict
          message: Migration revision changed; reload before submitting.
          request_id: example-request-id
          reason: revision_mismatch
    User:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/ID'
        username:
          type: string
          minLength: 3
          maxLength: 32
          pattern: ^[a-z0-9_]+$
        active:
          type: boolean
        platform_admin:
          type: boolean
      required:
      - id
      - username
      - active
      - platform_admin
    AuthMe:
      type: object
      additionalProperties: false
      properties:
        user:
          $ref: '#/components/schemas/User'
        platform_admin:
          type: boolean
        csrf_token:
          type: string
          description: Opaque token. Keep in memory; refresh with /auth/me after session rotation or csrf_failed.
            Never log it.
        leader_of:
          type: array
          items:
            $ref: '#/components/schemas/ID'
      required:
      - user
      - platform_admin
      - csrf_token
      - leader_of
      example:
        user:
          id: 30000000-0000-4000-8000-000000000001
          username: reviewer
          active: true
          platform_admin: false
        platform_admin: false
        csrf_token: example-token-not-a-session-identifier
        leader_of:
        - 40000000-0000-4000-8000-000000000001
    LoginInput:
      type: object
      additionalProperties: false
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 128
          description: 'M1 normalization: trim and lowercase, resulting in 3-32 ASCII letters/digits/underscore.
            Raw input <=128 UTF-8 bytes.'
        password:
          type: string
          format: password
          writeOnly: true
          minLength: 1
          description: Existing password; maximum 1024 UTF-8 bytes. New-password length policy does not apply to
            login.
      required:
      - username
      - password
    CreateUserInput:
      type: object
      additionalProperties: false
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 128
          description: 'M1 normalization: trim and lowercase, resulting in 3-32 ASCII letters/digits/underscore.
            Raw input <=128 UTF-8 bytes.'
        password:
          type: string
          format: password
          writeOnly: true
          minLength: 15
          description: At least 15 Unicode code points and at most 1024 UTF-8 bytes, no trimming.
        platform_admin:
          type: boolean
          default: false
      required:
      - username
      - password
    UpdateUserInput:
      type: object
      additionalProperties: false
      properties:
        active:
          type: boolean
        password:
          type: string
          format: password
          writeOnly: true
          minLength: 15
          description: At least 15 Unicode code points and at most 1024 UTF-8 bytes, no trimming.
      required: []
      minProperties: 1
      description: Atomic patch. Password reset revokes sessions. Cannot deactivate oneself or remove the last active
        admin.
    Group:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/ID'
        name:
          type: string
          minLength: 1
          maxLength: 64
        leader_user_id:
          type: string
          format: uuid
          nullable: true
          description: Null when not applicable.
        member_count:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
      required:
      - id
      - name
      - leader_user_id
      - member_count
    GroupInput:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
      required:
      - name
    LeaderInput:
      type: object
      additionalProperties: false
      properties:
        user_id:
          $ref: '#/components/schemas/ID'
      required:
      - user_id
      description: Must be an active member. Removing the current leader from membership is a conflict; replace
        leader first.
    Connection:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/ID'
        name:
          type: string
        engine:
          type: string
          enum:
          - postgresql
          - mysql
      required:
      - id
      - name
      - engine
      description: Never includes DSN, host credentials, or secret configuration. MySQL is retained for M1 compatibility;
        M2 workflow requires PostgreSQL.
    ConnectionInput:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
        engine:
          type: string
          enum:
          - postgresql
          - mysql
        dsn:
          type: string
          format: password
          writeOnly: true
          minLength: 1
          description: At most 4096 UTF-8 bytes; validated with restricted-role/receipt protections before storing.
      required:
      - name
      - engine
      - dsn
    Grant:
      type: object
      additionalProperties: false
      properties:
        group_id:
          $ref: '#/components/schemas/ID'
        group_name:
          type: string
        database_id:
          $ref: '#/components/schemas/ID'
        database_name:
          type: string
        access:
          $ref: '#/components/schemas/Access'
      required:
      - group_id
      - group_name
      - database_id
      - database_name
      - access
    GrantInput:
      type: object
      additionalProperties: false
      properties:
        access:
          $ref: '#/components/schemas/Access'
      required:
      - access
    Database:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/ID'
        name:
          type: string
        engine:
          type: string
          enum:
          - postgresql
          - mysql
        access:
          $ref: '#/components/schemas/Access'
        capabilities:
          type: object
          additionalProperties: false
          properties:
            schema_diff:
              type: boolean
            query_plans:
              type: boolean
            workflow:
              type: boolean
            batch:
              type: boolean
          required:
          - schema_diff
          - query_plans
          - workflow
          - batch
      required:
      - id
      - name
      - engine
      - access
      - capabilities
    TableKind:
      type: string
      enum:
      - table
      - partitioned_table
      - view
      - materialized_view
    TableSummary:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
        kind:
          $ref: '#/components/schemas/TableKind'
      required:
      - name
      - kind
    Schema:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
        tables:
          type: array
          items:
            $ref: '#/components/schemas/TableSummary'
      required:
      - name
      - tables
    SchemaCatalog:
      type: object
      additionalProperties: false
      properties:
        schemas:
          type: array
          items:
            $ref: '#/components/schemas/Schema'
      required:
      - schemas
      description: Bounded catalog snapshot (M1 limits); not a paginated list.
    Column:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
        data_type:
          type: string
        nullable:
          type: boolean
        default:
          type: string
          nullable: true
      required:
      - name
      - data_type
      - nullable
      - default
    Constraint:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
        type:
          type: string
        definition:
          type: string
      required:
      - name
      - type
      - definition
    Index:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
        definition:
          type: string
        unique:
          type: boolean
        primary:
          type: boolean
      required:
      - name
      - definition
      - unique
      - primary
    Table:
      type: object
      additionalProperties: false
      properties:
        schema:
          type: string
        name:
          type: string
        kind:
          $ref: '#/components/schemas/TableKind'
        columns:
          type: array
          items:
            $ref: '#/components/schemas/Column'
        constraints:
          type: array
          items:
            $ref: '#/components/schemas/Constraint'
        indexes:
          type: array
          items:
            $ref: '#/components/schemas/Index'
      required:
      - schema
      - name
      - kind
      - columns
      - constraints
      - indexes
    Cell:
      type: object
      additionalProperties: false
      properties:
        text:
          type: string
        'null':
          type: boolean
        truncated:
          type: boolean
        encoding:
          type: string
          enum:
          - text
          - hex
      required:
      - text
      - 'null'
      - truncated
      - encoding
      description: Preview only; text is bounded to 4096 bytes. NULL uses null=true and empty text. JSON remains
        display text; binary uses hex.
    RowsPage:
      type: object
      additionalProperties: false
      properties:
        columns:
          type: array
          items:
            type: string
        items:
          type: array
          items:
            type: array
            items:
              $ref: '#/components/schemas/Cell'
        page:
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
        limit:
          type: integer
          format: int64
          minimum: 1
          maximum: 200
        has_next:
          type: boolean
        order:
          type: string
          enum:
          - primary_key
          - best_effort
      required:
      - columns
      - items
      - page
      - limit
      - has_next
      - order
      description: Adapter maps M1 RowsPage.Rows to items. Rows without PK have best-effort ordering; payload bounded
        to 2 MiB.
    SchemaChange:
      type: object
      additionalProperties: false
      properties:
        action:
          type: string
          enum:
          - add
          - drop
          - alter
        object:
          type: string
        name:
          type: string
        before:
          type: string
        after:
          type: string
        destructive:
          type: boolean
      required:
      - action
      - object
      - name
      - before
      - after
      - destructive
    SchemaDiff:
      type: object
      additionalProperties: false
      properties:
        current_database_id:
          $ref: '#/components/schemas/ID'
        desired_database_id:
          $ref: '#/components/schemas/ID'
        current_schema:
          type: string
        desired_schema:
          type: string
        changes:
          type: array
          items:
            $ref: '#/components/schemas/SchemaChange'
        warnings:
          type: array
          items:
            type: string
        generated_up_sql:
          type: string
        validation:
          type: string
        destructive_count:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
      required:
      - current_database_id
      - desired_database_id
      - current_schema
      - desired_schema
      - changes
      - warnings
      - generated_up_sql
      - validation
      - destructive_count
      description: SQL candidate only; no auto-execution or guaranteed down SQL. Draft creation still requires explicit
        down SQL or irreversible reason.
    BatchConfig:
      type: object
      additionalProperties: false
      properties:
        schema:
          type: string
          minLength: 1
          maxLength: 63
        table:
          type: string
          minLength: 1
          maxLength: 63
        key_column:
          type: string
          minLength: 1
          maxLength: 63
        batch_size:
          type: integer
          format: int64
          minimum: 100
          maximum: 100000
        scope_where:
          type: string
          nullable: true
      required:
      - schema
      - table
      - key_column
      - batch_size
      - scope_where
      description: PostgreSQL UPDATE-only, K4 coordination required. Identifiers are single names, max 63 UTF-8
        bytes. Key must be unique, non-null, immutable smallint/integer/bigint. scope_where is a restricted expression,
        not arbitrary SQL.
    DefinitionInput:
      type: object
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 120
        up_sql:
          type: string
          minLength: 1
          description: 'Normal: complete validated SQL. Batch: SET assignments without SET keyword. At most 524288
            UTF-8 bytes.'
        down_sql:
          type: string
          nullable: true
          description: Same size/format as up_sql. Null only for irreversible migration.
        irreversible:
          type: boolean
        irreversible_reason:
          type: string
          maxLength: 2000
        mode:
          $ref: '#/components/schemas/ExecutionMode'
        batch:
          anyOf:
          - $ref: '#/components/schemas/BatchConfig'
          - type: object
            nullable: true
            enum:
            - null
      required:
      - title
      - up_sql
      - down_sql
      - irreversible
      - irreversible_reason
      - mode
      - batch
      allOf:
      - oneOf:
        - properties:
            irreversible:
              enum:
              - false
            down_sql:
              type: string
              minLength: 1
            irreversible_reason:
              enum:
              - ''
        - properties:
            irreversible:
              enum:
              - true
            down_sql:
              type: string
              enum:
              - null
              nullable: true
            irreversible_reason:
              type: string
              minLength: 1
      - oneOf:
        - properties:
            mode:
              enum:
              - normal
            batch:
              type: object
              enum:
              - null
              nullable: true
        - properties:
            mode:
              enum:
              - batch
            batch:
              $ref: '#/components/schemas/BatchConfig'
      example:
        title: Create example table
        up_sql: CREATE TABLE public.contract_example (id bigint PRIMARY KEY);
        down_sql: DROP TABLE public.contract_example;
        irreversible: false
        irreversible_reason: ''
        mode: normal
        batch: null
    UpdateDefinitionInput:
      type: object
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 120
        up_sql:
          type: string
          minLength: 1
          description: 'Normal: complete validated SQL. Batch: SET assignments without SET keyword. At most 524288
            UTF-8 bytes.'
        down_sql:
          type: string
          nullable: true
          description: Same size/format as up_sql. Null only for irreversible migration.
        irreversible:
          type: boolean
        irreversible_reason:
          type: string
