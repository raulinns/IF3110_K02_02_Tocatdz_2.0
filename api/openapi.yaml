openapi: 3.0.3
info:
  title: Tocatdz 2.0 Milestone 2 API
  version: 0.2.0-contract.1
  description: K1 review candidate, not implemented routes. Read api/README.md and docs/contracts/m2.md. API JSON
    uses snake_case, canonical UUIDs, UTC timestamps and explicit nulls. Same-origin cookie auth; no CORS. All protected
    unsafe methods require X-CSRF-Token AND valid Origin/Referer. Login is Origin-protected but token-exempt. Every
    API response is no-store with X-Request-ID. JSON bodies <=2 MiB (login <=16 KiB); SQL <=512 KiB each. Reject
    unknown/repeated query keys, unknown JSON fields, duplicate JSON keys and trailing JSON. No body for membership/delete/logout
    operations. API and domain models are mapped explicitly; secrets/session identifiers never appear in JSON. Query
    params in examples must be URL-encoded. See docs for provisional Q&A policies and atomicity requirements.
  contact:
    name: K02-02 / 13524056 (contract owner)
servers:
- url: /api/v1
  description: Same-origin API; Vite proxies /api during development.
tags:
- name: Auth
  description: Cookie sessions and CSRF bootstrap.
- name: Admin
  description: Platform admin only; does not grant target access.
- name: Explorer
  description: Read-only catalog and data access.
- name: Migrations
  description: Versioned immutable SQL definitions.
- name: Workflow
  description: Group-leader review and asynchronous enqueue.
- name: Jobs
  description: Progress and attempt metadata.
- name: History
  description: Committed executions and linear position.
- name: Operations
  description: Internal operations endpoints outside the API prefix.
security:
- sessionCookie: []
paths:
  /auth/login:
    post:
      operationId: login
      tags:
      - Auth
      summary: Login with cookie session
      description: Origin/Referer + Sec-Fetch-Site and rate limit required. No CSRF token required before login.
        JSON body <=16384 bytes. Set-Cookie creates session; response equals auth/me. Invalid credentials always
        generic 401.
      x-access: public
      responses:
        '200':
          description: Success.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Set-Cookie:
              $ref: '#/components/headers/SessionCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthMe'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
