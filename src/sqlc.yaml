version: "2"
sql:
  - engine: "postgresql"
    schema: "internal/platformdb/migrations/000001_initial.up.sql"
    queries: "internal/platformdb/queries"
    gen:
      go:
        package: "platformsqlc"
        out: "internal/platformdb/sqlc"
        sql_package: "pgx/v5"
        emit_interface: true
        emit_json_tags: false
        emit_empty_slices: true
        overrides:
          - db_type: "uuid"
            go_type: "string"
