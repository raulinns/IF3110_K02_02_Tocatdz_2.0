{{define "navbar"}}{{if .SignedIn}}
<header class="topbar">
	<button type="button" id="sidebarCollapse" class="btn btn-light btn-icon" aria-controls="sidebar" aria-expanded="false" aria-label="Tampilkan atau sembunyikan menu">
		<i class="fas fa-bars" aria-hidden="true"></i>
	</button>
	<div class="topbar-user">
		<button type="button" class="btn btn-light btn-icon" data-theme-toggle aria-pressed="false" title="Ganti tema">
			<i class="fas fa-moon theme-icon-dark" aria-hidden="true"></i>
			<i class="fas fa-sun theme-icon-light" aria-hidden="true"></i>
			<span class="visually-hidden">Ganti tema gelap atau terang</span>
		</button>
		<span class="username"><i class="fas fa-circle-user" aria-hidden="true"></i> <span class="name mono">{{.Identity.Username}}</span>{{if .Identity.PlatformAdmin}} <span class="badge access-view_edit">Admin</span>{{end}}</span>
		<form method="post" action="/logout">
			<input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
			<button type="submit" class="btn btn-sm btn-outline-secondary"><i class="fas fa-right-from-bracket" aria-hidden="true"></i><span class="btn-label">Keluar</span></button>
		</form>
	</div>
</header>
{{end}}{{end}}
