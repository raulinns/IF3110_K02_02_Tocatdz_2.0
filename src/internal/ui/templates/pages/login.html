{{define "content"}}
<section class="auth">
	<div class="auth-panel">
		<p class="brand">Tocatdz</p>
		<h1>Masuk</h1>
		<p class="lead">Platform pengelolaan database PostgreSQL.</p>
		{{with .Content}}
		{{if .Error}}<p class="notice notice-error" role="alert">{{.Error}}</p>{{end}}
		<form method="post" action="/login" class="form" novalidate>
			<div class="field">
				<label for="username">Username</label>
				<input id="username" name="username" type="text" value="{{.Username}}" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus>
			</div>
			<div class="field">
				<label for="password">Password</label>
				<input id="password" name="password" type="password" autocomplete="current-password" required>
			</div>
			<button type="submit" class="button button-primary">Masuk</button>
		</form>
		{{end}}
	</div>
</section>
{{end}}
