# Trace diterima lewat OTLP dari server dan worker. Log aplikasi (JSON di stdout) dibaca dari log Docker
# milik container ber-tag tocatdz-*; container lain di mesin yang sama diabaikan.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
  filelog:
    include: [/var/lib/docker/containers/*/*-json.log]
    start_at: end
    operators:
      - type: json_parser
        parse_from: body
      - type: filter
        expr: 'attributes.attrs == nil or attributes.attrs.tag == nil or not (attributes.attrs.tag startsWith "tocatdz-")'
      - type: move
        from: attributes.attrs.tag
        to: resource["service.name"]
      - type: move
        from: attributes.log
        to: body
      - type: remove
        field: attributes.attrs
      - type: remove
        field: attributes.stream
      - type: remove
        field: attributes.time

processors:
  batch: {}

exporters:
  otlphttp/loki:
    endpoint: http://loki:3100/otlp
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true

service:
  pipelines:
    logs:
      receivers: [filelog]
      processors: [batch]
      exporters: [otlphttp/loki]
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/tempo]
